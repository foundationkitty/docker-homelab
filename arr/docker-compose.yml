services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - .env
    volumes:
      - ./sonarr:/config
      - /mnt/storage:/storage
    ports:
      - 8989:8989
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - .env
    volumes:
      - ./radarr:/config
      - /mnt/storage/:/storage
    ports:
      - 7878:7878
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - ./bazarr:/config
      - /mnt/storage:/storage
    ports:
      - 6767:6767
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - 8191:8191
    restart: always

  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    volumes:
      - ./jackett:/config
    env_file:
      - .env
    ports:
      - 9117:9117
    restart: always

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./prowlarr:/config
    env_file:
      - .env
    ports:
      - 9696:9696
    restart: always

networks:
  default:
    name: home
    external: true
