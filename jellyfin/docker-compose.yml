services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=US/Pacific
    volumes:
      - ./config:/config
      - /mnt/storage:/storage
      - ./fonts:/usr/local/share/fonts/custom
    ports:
      - 8096:8096
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all

networks:
  default:
    name: web
    external: true
